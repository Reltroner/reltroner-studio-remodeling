name: Asthortera Cross-Domain Canon QA

on:
  workflow_dispatch:
  push:
    paths:
      - "content/**"
      - "data/asthortera/**"
      - "tools/audit-asthortera-cross-domain.mjs"
      - "tools/sync-asthortera-nccm-crossdocs.mjs"
      - "tools/audit-asthortera-metric-mentions.mjs"
      - "package.json"
      - "tests/asthortera-*.test.mjs"
      - ".github/workflows/asthortera-canon-qa.yml"
  pull_request:
    paths:
      - "content/**"
      - "data/asthortera/**"
      - "tools/audit-asthortera-cross-domain.mjs"
      - "tools/sync-asthortera-nccm-crossdocs.mjs"
      - "tools/audit-asthortera-metric-mentions.mjs"
      - "package.json"
      - "tests/asthortera-*.test.mjs"
      - ".github/workflows/asthortera-canon-qa.yml"

permissions:
  contents: read

jobs:
  canon-audit:
    name: Cross-domain quantitative & canon consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run worldbuilding statistical regression tests
        run: npm run test:worldbuilding
      - name: Enforce all 19 NCCM V6.5 national profile integration gates
        run: npm run canon:v65:reconcile:check
      - name: Enforce NCCM V6.5 planetary and immigrant-document concordance
        run: npm run canon:v65:crossdocs:check
      - name: Generate diagnostic report for all content Markdown
        continue-on-error: true
        run: node tools/audit-asthortera-cross-domain.mjs --json > asthortera-canon-qa.json
      - name: Mine cross-content country metric references for manual QA
        run: node tools/audit-asthortera-metric-mentions.mjs | tee asthortera-metric-mentions.json
      - name: Upload diagnostics even if strict QA fails
        uses: actions/upload-artifact@v4
        with:
          name: asthortera-canon-qa
          path: |
            asthortera-canon-qa.json
            asthortera-metric-mentions.json
      - name: Enforce active six-way ancestry, GDP/GNI, SDI and census invariants
        run: node tools/audit-asthortera-cross-domain.mjs --json
